# H2 In-Memory Database Configuration for Isolated Automated Tests
spring.datasource.url=jdbc:h2:mem:bloodbridgetestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration for Test Execution
bloodbridge.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
bloodbridge.security.jwt.expiration=86400000
bloodbridge.security.jwt.refresh-expiration=604800000

# Server & Logging Configuration for Tests
server.port=0
logging.level.root=INFO
logging.level.com.bloodbridge=INFO

# Disable external notification services during automated tests
firebase.enabled=false
