# ==============================================================================
# Database Configuration with Environment Variable Support
# Supports standard DB_* and SPRING_DATASOURCE_* environment variables
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/blood_bridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.address=0.0.0.0
server.port=${PORT:8083}

# HikariCP Pool Optimization for Cloud Database Latency
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=3000

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# JWT Security Configuration
# ==============================================================================
bloodbridge.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
bloodbridge.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
bloodbridge.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==============================================================================
# Application, Frontend & CORS Configuration
# ==============================================================================
app.frontend.url=${FRONTEND_URL:https://blood-bridge-sepia.vercel.app}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://blood-bridge-sepia.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8083}

# ==============================================================================
# System Admin Seeding Configuration
# ==============================================================================
app.admin.email=${ADMIN_EMAIL:admin@bloodbridge.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.phone=${ADMIN_PHONE:0000000000}
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}

# ==============================================================================
# Swagger / OpenAPI Documentation Configuration
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# Production-Safe Logging Configuration
# ==============================================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.bloodbridge=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ==============================================================================
# Spring Mail Properties with Environment Variable Support
# Supports standard MAIL_* and SPRING_MAIL_* environment variables
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==============================================================================
# HTTPS REST API Email Configuration (Production Cloud Fallback over Port 443)
# ==============================================================================
app.email.provider=${EMAIL_PROVIDER:smtp}
app.email.resend.api-key=${RESEND_API_KEY:${EMAIL_API_KEY:}}
app.email.from=${EMAIL_FROM:${RESEND_FROM_EMAIL:BloodBridge <onboarding@resend.dev>}}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.from=${BREVO_FROM_EMAIL:insureai2@gmail.com}

# ==============================================================================
# Firebase Cloud Messaging Configuration
# ==============================================================================
firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:src/main/resources/firebase/firebase-service-account.json}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.enabled=${FIREBASE_ENABLED:false}

# ==============================================================================
# Smart Donor Matching Engine Configuration
# ==============================================================================
matching.radius.primary=${MATCHING_RADIUS_PRIMARY:50.0}
matching.radius.secondary=${MATCHING_RADIUS_SECONDARY:75.0}
matching.radius.tertiary=${MATCHING_RADIUS_TERTIARY:100.0}
matching.batch.size=${MATCHING_BATCH_SIZE:10}
matching.minimum.acceptances=${MATCHING_MINIMUM_ACCEPTANCES:1}
matching.cooldown.days=${MATCHING_COOLDOWN_DAYS:90}

# ==============================================================================
# Groq AI Assistant Configuration
# ==============================================================================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.temperature=${GROQ_TEMPERATURE:0.7}
groq.max-tokens=${GROQ_MAX_TOKENS:1024}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:15}
