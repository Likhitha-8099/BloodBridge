# Database Configuration with Environment Variable Support
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blood_bridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567890}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8083}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration with Environment Variable Support
bloodbridge.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
bloodbridge.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
bloodbridge.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.root=INFO
logging.level.com.bloodbridge=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Mail Properties with Environment Variable Support
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:insurai2@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ──── Firebase Cloud Messaging — Phase 3B ────────────────────────────────────
# Path to the Firebase Service Account JSON (relative or absolute).
# Set FIREBASE_SERVICE_ACCOUNT_PATH in your .env to override.
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:src/main/resources/firebase/firebase-service-account.json}
# GCP Project ID tied to the Firebase project.
firebase.project-id=${FIREBASE_PROJECT_ID:}
# Master switch — set to false to disable FCM without removing config.
firebase.enabled=${FIREBASE_ENABLED:false}

# ──── Phase 3D.1 Smart Donor Matching Engine Configuration ────────────────────
matching.radius.primary=${MATCHING_RADIUS_PRIMARY:50.0}
matching.radius.secondary=${MATCHING_RADIUS_SECONDARY:75.0}
matching.radius.tertiary=${MATCHING_RADIUS_TERTIARY:100.0}
matching.batch.size=${MATCHING_BATCH_SIZE:10}
matching.minimum.acceptances=${MATCHING_MINIMUM_ACCEPTANCES:1}
matching.cooldown.days=${MATCHING_COOLDOWN_DAYS:90}

# ──── Groq AI Assistant — Module 1 Configuration ──────────────────────────────
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.temperature=${GROQ_TEMPERATURE:0.7}
groq.max-tokens=${GROQ_MAX_TOKENS:1024}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:15}
